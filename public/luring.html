<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Tidak ada koneksi — Twitter Mini</title>
    <!--
      Halaman ini disajikan service worker ketika jaringan mati, jadi ia harus
      berdiri sendiri: tidak ada CSS, gambar, atau skrip dari luar berkas ini.
      Dua bahasa ditulis berdampingan karena pilihan bahasa pengguna ada di
      kuki yang tidak dibaca berkas statis.
    -->
    <style>
      :root {
        color-scheme: dark light;
        --latar: #000000;
        --teks: #e7e9ea;
        --samar: #71767b;
        --aksen: #1d9bf0;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --latar: #ffffff;
          --teks: #0f1419;
          --samar: #536471;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--latar);
        color: var(--teks);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .kotak {
        max-width: 380px;
        text-align: center;
      }
      svg {
        color: var(--aksen);
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 21px;
      }
      p {
        color: var(--samar);
        font-size: 15px;
      }
      p + p {
        margin-top: 6px;
      }
      button {
        margin-top: 20px;
        padding: 11px 22px;
        border: 0;
        border-radius: 999px;
        background: var(--aksen);
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #1a8cd8;
      }
    </style>
  </head>
  <body>
    <div class="kotak">
      <svg viewBox="0 0 32 32" width="56" height="56" aria-hidden="true">
        <path
          fill="currentColor"
          d="M16 3.2c7.1 0 12.8 4.6 12.8 10.6 0 6-5.7 10.6-12.8 10.6-1.2 0-2.3-.12-3.4-.36l-6.5 4.36 1.9-5.9C4.6 20.4 3.2 17.4 3.2 13.8 3.2 7.8 8.9 3.2 16 3.2Z"
        />
        <path fill="var(--latar)" d="M10.4 11.6h11.2v2.1H10.4zm0 4.3h7.6V18h-7.6z" />
      </svg>
      <h1>Tidak ada koneksi</h1>
      <p>
        Komentar tersimpan di server, jadi Twitter Mini butuh jaringan untuk
        menampilkannya. Sambungkan lagi, lalu coba muat ulang.
      </p>
      <p lang="en">
        Comments live on the server, so Twitter Mini needs a connection to show
        them. Get back online, then reload.
      </p>
      <button type="button" onclick="location.reload()">
        Coba lagi · Try again
      </button>
    </div>
  </body>
</html>
