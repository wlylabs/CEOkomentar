<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tidak ada koneksi — Twitter Mini</title>
    <!--
      Halaman ini disajikan service worker ketika jaringan mati, jadi ia harus
      berdiri sendiri: tidak ada CSS, gambar, atau skrip dari luar berkas ini.
      Dua bahasa ditulis berdampingan karena pilihan bahasa pengguna ada di
      kuki yang tidak dibaca berkas statis.
    -->
    <style>
      :root {
        color-scheme: dark light;
        --latar: #000000;
        --teks: #e7e9ea;
        --samar: #71767b;
        --aksen: #1d9bf0;
      }
      /* Tanpa pilihan tersimpan, setelan sistem yang dipakai. */
      @media (prefers-color-scheme: light) {
        :root {
          --latar: #ffffff;
          --teks: #0f1419;
          --samar: #536471;
        }
      }
      /* Pilihan pemakai di aplikasi menang atas setelan sistem, sama seperti
         di halaman biasa; skrip di bawah yang memasang atributnya. */
      :root[data-tema="gelap"] {
        color-scheme: dark;
        --latar: #000000;
        --teks: #e7e9ea;
        --samar: #71767b;
      }
      :root[data-tema="terang"] {
        color-scheme: light;
        --latar: #ffffff;
        --teks: #0f1419;
        --samar: #536471;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--latar);
        color: var(--teks);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .kotak {
        max-width: 380px;
        text-align: center;
      }
      svg {
        color: var(--aksen);
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 21px;
      }
      p {
        color: var(--samar);
        font-size: 15px;
      }
      p + p {
        margin-top: 6px;
      }
      button {
        margin-top: 20px;
        padding: 11px 22px;
        border: 0;
        border-radius: 999px;
        background: var(--aksen);
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #1a8cd8;
      }
    </style>
    <!--
      Kembaran SKRIP_TEMA di lib/tema.ts. Berkas ini tidak boleh mengimpor apa
      pun, jadi logikanya ditulis ulang; keduanya harus ikut berubah bila salah
      satu diubah.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tm-tema");
          if (t !== "terang" && t !== "gelap") {
            t = matchMedia("(prefers-color-scheme: light)").matches
              ? "terang"
              : "gelap";
          }
          document.documentElement.dataset.tema = t;
          var m = document.createElement("meta");
          m.name = "theme-color";
          m.content = t === "terang" ? "#ffffff" : "#000000";
          document.head.appendChild(m);
        } catch (e) {
          /* Tanpa localStorage halaman ini tetap terbaca lewat @media. */
        }
      })();
    </script>
  </head>
  <body>
    <div class="kotak">
      <svg viewBox="0 0 512 512" width="56" height="56" aria-hidden="true">
        <path
          fill="currentColor"
          d="M384 424C442 400 470 342 464 280c-3-34-11-60-17-68-9 14-15 38-17 68-4 48-22 82-60 106Z"
        />
        <path
          fill="currentColor"
          d="M142 104c18-12 58 14 86 50 20-9 36-9 56 0 28-36 68-62 86-50 18 12 2 54-20 88 24 32 28 70 6 98 40 22 48 60 48 96 0 42-64 68-148 68s-148-26-148-68c0-36 8-74 48-96-22-28-18-66 6-98-22-34-38-76-20-88Z"
        />
      </svg>
      <h1>Tidak ada koneksi</h1>
      <p>
        Komentar tersimpan di server, jadi Twitter Mini butuh jaringan untuk
        menampilkannya. Sambungkan lagi, lalu coba muat ulang.
      </p>
      <p lang="en">
        Comments live on the server, so Twitter Mini needs a connection to show
        them. Get back online, then reload.
      </p>
      <button type="button" onclick="location.reload()">
        Coba lagi · Try again
      </button>
    </div>
  </body>
</html>
